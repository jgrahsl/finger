<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Finger · Tindeq Progressor</title>
    <link rel="stylesheet" href="style.css" />
    <script>
      // Set before first paint: the saved choice, else the system setting.
      (function () {
        var saved = null;
        try {
          saved = localStorage.getItem('theme');
        } catch (e) {}
        var dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      })();
      // Show script errors on the page: there is no console on a phone or tablet.
      function showError(message) {
        var status = document.getElementById('status');
        if (!status) return;
        status.textContent = 'Error: ' + message;
        status.dataset.kind = 'error';
      }
      addEventListener('error', function (event) {
        showError(event.message + ' (' + String(event.filename).split('/').pop() + ':' + event.lineno + ')');
      });
      addEventListener('unhandledrejection', function (event) {
        showError(event.reason && event.reason.message ? event.reason.message : String(event.reason));
      });
    </script>
    <script type="module" src="js/app.js"></script>
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>Finger <span id="build" class="build" data-page="21"></span></h1>
          <p class="meta"><span id="status"></span> <span id="device"></span> <span id="rate"></span></p>
        </div>
        <div class="actions">
          <button id="theme" class="ghost"></button>
          <button id="demo" class="ghost">Demo</button>
          <button id="connect">Connect</button>
        </div>
      </header>

      <nav role="tablist">
        <button role="tab" data-view="measure-view" aria-selected="true">Measure</button>
        <button role="tab" data-view="timer-view" aria-selected="false">Timer</button>
        <button role="tab" data-view="rfd-view" aria-selected="false">RFD</button>
      </nav>

      <div id="measure-view" class="view">
      <p id="unsupported" class="notice" hidden></p>

      <section class="stats">
        <div class="stat primary">
          <span class="label">Current</span>
          <span class="value"><span id="current">0.0</span> <span class="unit">kg</span></span>
        </div>
        <div class="stat">
          <span class="label">Peak</span>
          <span class="value"><span id="peak">0.0</span> <span class="unit">kg</span></span>
        </div>
        <div class="stat">
          <span class="label">Time</span>
          <span class="value"><span id="duration">0.0</span> s</span>
        </div>
      </section>

      <div id="bands" class="bands" aria-label="Colour of the force value from each load"></div>

      <canvas id="chart"></canvas>

      <footer>
        <button id="reset" class="wide">Reset</button>
        <button id="tare" class="ghost">Tare</button>
        <button id="export" class="ghost">Export CSV</button>
      </footer>
      </div>

      <div id="timer-view" class="view" data-phase="idle" hidden>
        <div class="rep-progress" aria-hidden="true">
          <div id="timer-progress-parts" class="rep-progress-parts"></div>
          <div id="timer-progress-veil" class="rep-progress-veil"></div>
        </div>
        <div class="timer-main">
        <div id="timer-gauge" class="gauge" aria-hidden="true" hidden>
          <div class="gauge-track"><div id="timer-gauge-fill" class="gauge-fill"></div></div>
        </div>
        <section class="timer-display">
          <div id="timer-flash" class="timer-flash"></div>
          <span id="timer-phase" class="label">Ready</span>
          <span id="timer-count">7</span>
          <span class="timer-reps">Rep <span id="timer-reps">0</span></span>
          <div id="timer-rep-controls" class="rep-controls" role="group" aria-label="Correct the rep count" hidden>
            <button id="timer-rep-down" aria-label="One rep less">−</button>
            <button id="timer-rep-zero" aria-label="Reps to zero">0</button>
            <button id="timer-rep-up" aria-label="One rep more">+</button>
          </div>
          <span id="timer-force-row" class="timer-force" hidden>
            <span id="timer-force-chip" class="chip"><span id="timer-force">0.0</span> <span class="unit">kg</span></span>
          </span>
        </section>
        </div>
        <footer>
          <div id="timer-presets" class="presets" role="group" aria-label="Work / rest seconds">
            <button data-work="7" data-rest="3" aria-pressed="true">7 / 3</button>
            <button data-work="10" data-rest="3" aria-pressed="false">10 / 3</button>
            <button data-work="10" data-rest="5" aria-pressed="false">10 / 5</button>
            <button data-work="10" data-rest="10" aria-pressed="false">10 / 10</button>
            <button data-work="10" data-rest="20" aria-pressed="false">10 / 20</button>
          </div>
          <button id="timer-mute" class="ghost"></button>
          <button id="timer-colors" class="ghost">🎨</button>
          <button id="timer-pause" class="ghost" disabled>Pause</button>
          <button id="timer-toggle" class="wide">Start</button>
        </footer>
      </div>

      <div id="rfd-view" class="view" hidden>
        <section class="stats rfd-stats">
          <div class="stat primary">
            <span class="label">Peak RFD</span>
            <span class="value"><span id="rfd-peak">–</span> <span class="unit">kg/s</span></span>
          </div>
          <div class="stat">
            <span class="label">20–80 % RFD</span>
            <span class="value"><span id="rfd-2080">–</span> <span class="unit">kg/s</span></span>
          </div>
          <div class="stat">
            <span class="label">Peak force</span>
            <span class="value"><span id="rfd-force">–</span> <span class="unit">kg</span></span>
          </div>
          <div class="stat">
            <span class="label">Time to peak</span>
            <span class="value"><span id="rfd-ttp">–</span> <span class="unit">ms</span></span>
          </div>
        </section>

        <p id="rfd-hint" class="meta"></p>

        <canvas id="rfd-chart"></canvas>

        <footer>
          <div id="rfd-attempts" class="attempts"></div>
          <button id="rfd-clear" class="ghost">Clear</button>
        </footer>
      </div>
    </main>
  </body>
</html>
